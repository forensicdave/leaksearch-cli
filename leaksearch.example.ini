# Copy to ~/.config/leaksearch/config.ini and chmod 600.
# Pass it with:  leaksearch.py --config ~/.config/leaksearch/config.ini ...
[leaksearch]
# Required. Create one at leaksear.ch (POST /api/v1/user/api-tokens); the raw
# value is shown only once. Can also come from $LEAKSEARCH_API_KEY or --api-key.
api_key = REPLACE_ME

# Optional settings, shown with their defaults.
base_url = https://leaksear.ch

# How the key is sent. The published OpenAPI document does not name a security
# scheme, so the client defaults to:  Authorization: Bearer <api_key>
# If the service expects something else, adjust these two, e.g.
#   auth_header = x-api-key
#   auth_scheme =            (empty = send the bare key with no prefix)
auth_header = Authorization
auth_scheme = Bearer

# Local ledger of every search (id, spend, where the output went).
# Set to "off" to disable; default is $XDG_STATE_HOME/leaksearch/searches.jsonl.
; ledger = ~/.local/state/leaksearch/searches.jsonl
; watch_state_dir = ~/.local/state/leaksearch/watch

# Hard cap on credits any single invocation may spend (--budget overrides).
; max_credits_per_run = 10

poll_interval = 3        ; seconds between status polls (grows up to 30s)
poll_timeout = 900       ; give up polling after this long; 0 = wait forever
page_size = 100          ; records per page when downloading (API max is 100)
request_timeout = 60     ; per-HTTP-request timeout in seconds
max_retries = 4          ; retries for 429 / 5xx / network errors
verify_tls = true
